version: '3.8'

services:
  backend:
    build: ./backend
    container_name: zenith_backend
    ports:
      - "8000:8000"
    volumes:
      - backend_data:/app/data
    restart: always

  dashboard:
    build: ./dashboard
    container_name: zenith_dashboard
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always

volumes:
  backend_data:
